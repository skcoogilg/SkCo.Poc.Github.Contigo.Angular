<div class="gallery">
  <section class="hero" aria-labelledby="poc-hero-title">
    <img
      class="hero__image"
      [src]="hero.imageUrl"
      [alt]="hero.imageAlt"
      [width]="hero.imageWidth"
      [height]="hero.imageHeight"
    />
    <div class="hero__caption">
      <span class="hero__badge text-body-3">{{ hero.envLabel }}: {{ envName }}</span>
      <h2 id="poc-hero-title" class="title-h2">{{ hero.title }}</h2>
      <p class="text-body-2">{{ hero.subtitle }}</p>
    </div>
  </section>

  <img
    class="gallery__portrait"
    [src]="portrait.imageUrl"
    [alt]="portrait.imageAlt"
    [width]="portrait.imageWidth"
    [height]="portrait.imageHeight"
  />
</div>
