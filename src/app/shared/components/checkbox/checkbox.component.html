<form
  class="p-0 form-check gap-2 d-flex flex-column"
  [formGroup]="checkboxForm"
>
  <p class="text-body-3 bold" *ngIf="checkboxProperties.tittle !== ''">
    {{ checkboxProperties.tittle }}
  </p>
  <div class="p-2 container-checkbox">
    <div
      class="d-flex justify-content-between ms-2 me-2 check-option"
      *ngFor="let option of options"
    >
      <p class="sk-b3 mb-1">{{ option.name }}</p>
      <div class="d-flex align-items-center justify-content-end">
        <input
          class="form-check-input"
          type="checkbox"
          [value]="option.value"
          [formControlName]="option.value"
        />
      </div>
    </div>
  </div>
  @if (showCanCheckAll) {
  <div class="p-2 container-checkbox d-flex align-items-center gap-2">
    <span class="text-body-4 w-100">Seleccionar todas las columnas</span>
    <div class="form-check form-switch" [style.paddingLeft.em]="2.5">
      <input
        class="form-check-input pointer"
        type="checkbox"
        role="switch"
        [checked]="allChecked"
        (change)="allCheckedChangeEvent($event)"
      />
    </div>
  </div>
  }
</form>
