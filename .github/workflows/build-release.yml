# One deployable version per environment branch:
#   push to dev | stg | prd
#     -> build with that Angular configuration (npm run build:<env>)
#     -> GitHub Release "<env>-<run>" with the js/css (versioned storage)
#     -> GitHub Pages: the whole site is rebuilt from the LATEST release of every
#        environment, because a Pages deployment always replaces the full site.
# Pages is opt-in: repo variable PAGES_ENABLED=true, and dev/stg/prd allowed in
# Settings > Environments > github-pages > Deployment branches.
name: Build & Deploy

on:
  push:
    branches: [dev, stg, prd]
  workflow_dispatch:

env:
  ELEMENT_NAME: poc-github-contigo
  NODE_VERSION: 20.17.0

jobs:
  build:
    name: Build (${{ github.ref_name }})
    if: contains(fromJSON('["dev","stg","prd"]'), github.ref_name)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build ${{ github.ref_name }}
        run: npm run build:${{ github.ref_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: elements-${{ github.ref_name }}
          path: elements/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Release (${{ github.ref_name }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: elements-${{ github.ref_name }}
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENV_NAME: ${{ github.ref_name }}
        run: |
          TAG="${ENV_NAME}-${GITHUB_RUN_NUMBER}"
          (cd release && sha256sum * > SHA256SUMS.txt)

          cat > notes.md <<EOF
          Environment **${ENV_NAME}** — commit \`${GITHUB_SHA::7}\`, run [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).
          EOF

          # Only prd is marked as "latest"; dev/stg are prereleases.
          FLAGS=(--prerelease)
          [[ "$ENV_NAME" == "prd" ]] && FLAGS=(--latest)

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file notes.md \
              "${FLAGS[@]}"
          fi

  pages:
    name: Deploy GitHub Pages
    needs: release
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Serialize deployments; each one republishes every environment, so the last
    # one to run always contains the latest release of dev, stg and prd.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Assemble site from the latest release of each environment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir site
          rows=""
          for env in dev stg prd; do
            tag=$(gh release list --limit 200 --json tagName,createdAt \
              --jq "map(select(.tagName | startswith(\"${env}-\"))) | sort_by(.createdAt) | last | .tagName // empty")
            if [[ -z "$tag" ]]; then
              echo "::notice::No release yet for ${env}"
              continue
            fi
            gh release download "$tag" --dir "site/${env}" \
              --pattern "${ELEMENT_NAME}.js" --pattern "${ELEMENT_NAME}.css"
            sha=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
            printf '{"env":"%s","tag":"%s","commit":"%s"}\n' "$env" "$tag" "$sha" > "site/${env}/version.json"
            rows+="<tr><td>${env}</td><td>${tag}</td><td><a href=\"${env}/${ELEMENT_NAME}.js\">js</a> · <a href=\"${env}/${ELEMENT_NAME}.css\">css</a> · <a href=\"${env}/version.json\">version</a></td></tr>"
          done

          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="es"><meta charset="utf-8"><title>${ELEMENT_NAME}</title>
          <h1>${ELEMENT_NAME}</h1>
          <table><tr><th>Ambiente</th><th>Release</th><th>Archivos</th></tr>${rows}</table>
          </html>
          EOF
          find site -type f

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
